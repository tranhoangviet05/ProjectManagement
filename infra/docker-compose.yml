services:
  postgres:
    image: postgres:16-alpine
    container_name: stb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_travel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - stb_pgdata:/var/lib/postgresql/data
volumes:
  stb_pgdata:
