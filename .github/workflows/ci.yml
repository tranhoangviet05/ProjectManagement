name: Monorepo CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend Monorepo (Lint & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Code Quality (Lint)
        run: pnpm lint

      - name: Build Web Application
        run: pnpm build:web

  backend-quality:
    name: Laravel Backend (Pint & PHPUnit Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: social_travel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, curl, intl, zip, xml, sqlite3
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        working-directory: apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Environment Configuration
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p storage/app/private/kyc storage/app/public storage/app/firebase
          echo '{"type":"service_account","project_id":"socialtravelbooking"}' > storage/app/firebase/firebase-service-account.json
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: social_travel
          DB_USERNAME: postgres
          DB_PASSWORD: password

      - name: Run Database Migrations
        working-directory: apps/api
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: social_travel
          DB_USERNAME: postgres
          DB_PASSWORD: password

      - name: Verify Code Style (Laravel Pint)
        working-directory: apps/api
        run: ./vendor/bin/pint --test

      - name: Run Feature & Unit Tests (PHPUnit)
        working-directory: apps/api
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: social_travel
          DB_USERNAME: postgres
          DB_PASSWORD: password
